$kind: http-request
method: POST
url: '{{base_url}}/users'
order: 4500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email":"missing-name@example.com"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('rejects a missing name', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('MISSING_REQUIRED_FIELD');
      });
