$kind: http-request
method: POST
url: '{{base_url}}/users'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: text
  content: '{bad json'
scripts:
  - type: afterResponse
    code: |-
      pm.test('rejects malformed JSON', () => {
