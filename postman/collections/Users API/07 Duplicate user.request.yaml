$kind: http-request
method: POST
url: '{{base_url}}/users'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"Duplicate Ada","email":"{{duplicate_email}}"}
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('duplicate_email', pm.collectionVariables.get('test_email').toUpperCase());
  - type: afterResponse
    code: |-
      pm.test('rejects a duplicate email regardless of case', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error.code).to.eql('DUPLICATE_USER');
      });
